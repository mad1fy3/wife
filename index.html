<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Will You Marry Me?</title>

<style>
body {
    background-color: black;
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* Container */
.container {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    margin-top: 50px;
    text-align: center;
}

/* 💍 Ring Icon (PURE CSS) */
.ring {
    width: 80px;
    height: 80px;
    border: 6px solid gold;
    border-radius: 50%;
    position: relative;
    margin-bottom: 20px;
}

.ring::before {
    content: '';
    position: absolute;
    top: -25px;
    left: 50%;
    transform: translateX(-50%);
    width: 25px;
    height: 25px;
    background: cyan;
    border-radius: 50%;
    box-shadow: 0 0 10px cyan, 0 0 20px cyan;
}

/* Buttons */
.buttons {
    display: flex;
    justify-content: center;
    margin-top: 20px;
    flex-wrap: wrap;
}

button {
    margin: 10px;
    padding: 10px 20px;
    border: none;
    cursor: pointer;
    font-size: 16px;
    border-radius: 8px;
}

#yes-button {
    background-color: green;
    color: white;
    height: 50px;
    width: 100px;
}

#no-button {
    background-color: red;
    color: white;
    height: 50px;
}

/* Message */
.message {
    display: none;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

    <!-- 💍 Ring -->
    <div class="ring"></div>

    <!-- Question -->
    <h1 id="question-heading">Will you marry me?</h1>

    <!-- Buttons -->
    <div class="buttons">
        <button id="yes-button">Yes</button>
        <button id="no-button">No</button>
    </div>

    <!-- UPDATED MESSAGE WITH GIF -->
    <div class="message">
        <h2></h2>
        <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExbXh0bTFqcmgzaGN4YnJrZDY0c21yaTY5N21wMDJ3ZzBqcGg4YXUxeSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3og0IQ29pE7zRwbh60/giphy.gif" 
             style="width:250px; margin-top:20px; border-radius:12px;">
    </div>

</div>

<script>
const answers_no = [
    "No",
    "Are you sure?",
    "Think again?",
    "Come on 😭",
    "Don't do this...",
    "Please?",
    "Last chance...",
    "You're breaking my heart 💔",
    "Okay this hurts...",
    "Why 😭"
];

const no_button = document.getElementById('no-button');
const yes_button = document.getElementById('yes-button');

let i = 1;
let size = 100;

/* NO BUTTON */
no_button.addEventListener('click', () => {

    // 🔥 TRUE INFINITE GROWTH
    const growth = Math.random() * 30 + 20;
    size += growth;

    yes_button.style.width = size + "px";
    yes_button.style.height = size + "px";

    // text cycles forever
    no_button.innerText = answers_no[i % answers_no.length];
    i++;
});

/* YES BUTTON */
yes_button.addEventListener('click', () => {
    document.querySelector('.message').style.display = 'block';
    document.querySelector('.buttons').style.display = 'none';
    document.getElementById('question-heading').innerText = "She said YES 💍❤️";
});
</script>

</body>
</html>
